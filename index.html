    .container {

    .title {

    .title .english {

    .card {

    .social-icons {

    .icon-btn {

      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(93, 185, 201, 0.15);
      color: #5DB9C9;
      cursor: pointer;

    }

      height: 24px;
    }

    .avatar-card {

      background: #e0e0e0;

      margin-left: auto;
      margin-right: auto;
      transform: scale(1.15);

    .avatar-placeholder {

      height: 110px;
      border-radius: 50%;

    .music-player {

      justify-content: center;

    .album-cover img {

    .album-text {

  <script>
    // 纪念日：2020-09-10，页面加载时大约显示 2153 天
    const startDate = new Date('2001-07-05T07:00:00');

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);
      document.getElementById('counter').textContent = days + '天' + hours + '小时' + minutes + '分' + seconds + '秒';
    }

    updateCounter();
    setInterval(updateCounter, 1000);
  </script>
